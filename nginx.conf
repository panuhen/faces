server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    types {
        application/wasm wasm;
        application/octet-stream task glb;
    }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # The camera only works on a secure origin; TLS is terminated by the host (Coolify/Traefik etc.).
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options nosniff always;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }
    location ~* \.(task|wasm|glb)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
